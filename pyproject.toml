[project]
name = "meeting-notes"
version = "0.1.0"
description = "Offline meeting notes: faster-whisper transcription, then map-reduce summarization into decisions and action items with timestamps."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abbishekk DGS" }]
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.1", "av>=11,<17", "httpx>=0.27"]

[project.urls]
Homepage = "https://abbishekkdgs.tech"
Repository = "https://github.com/Abbishekk-DGS/meeting-notes"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
meeting-notes = "meeting_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_notes"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
